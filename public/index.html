<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voetbal Team App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
        <header class="bg-blue-600 text-white p-4">
            <h1 class="text-xl font-bold text-center">⚽ Mijn Voetbal Team</h1>
        </header>
        <main class="p-4">
            <div id="status-card" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
                <p id="status-text">Server status laden...</p>
            </div>
        </main>
    </div>

    <script>
        // Check of de backend werkt
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status-text').innerText = data.message;
            })
            .catch(err => {
                document.getElementById('status-text').innerText = "Fout bij verbinden met server.";
                console.error(err);
            });
    </script>
</body>
</html>
